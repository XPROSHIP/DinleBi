services:
  - type: web
    name: DinleBi
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DOWNLOAD_DIR
        value: /tmp/dinlebi/indirilenler
      - key: CACHE_DIR
        value: /tmp/dinlebi/cache/hls
